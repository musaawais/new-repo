name: Build macOS DMG

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install

      - name: Patch source files
        run: |
          node -e "
            const fs = require('fs');

            // Remove free-vpn import and refs from index.ts
            let src = fs.readFileSync('src/main/index.ts', 'utf8');
            src = src.replace(/import\s*\{[^}]*FreeVpnManager[^}]*\}\s*from\s*['\"]\.\/free-vpn['\"];\s*\n?/g, '');
            src = src.replace(/\s*freeVpn:\s*null\s*as\s*FreeVpnManager\s*\|\s*null,?\s*\n?/g, '\n');
            src = src.replace(/refs\.freeVpn\?\.getProxyRules\(\)\s*\?\?\s*/g, '');
            src = src.replace(/:\s*import\(['\"]\.\/free-vpn['\"]\)\.VpnState/g, '');
            src = src.replace(/\s*as\s+FreeVpnManager\b/g, ' as any');
            fs.writeFileSync('src/main/index.ts', src);
            console.log('index.ts patched');

            // Disable strict mode in tsconfig
            const tc = JSON.parse(fs.readFileSync('tsconfig.main.json', 'utf8'));
            tc.compilerOptions.strict = false;
            tc.compilerOptions.noImplicitAny = false;
            fs.writeFileSync('tsconfig.main.json', JSON.stringify(tc, null, 2));
            console.log('tsconfig patched');
          "

      - name: Create vite config
        run: |
          node -e "
          const fs = require('fs');
          const cfg = \`import { defineConfig } from 'vite';
          import react from '@vitejs/plugin-react';
          import { fileURLToPath } from 'url';
          import path from 'path';
          const __filename = fileURLToPath(import.meta.url);
          const __dirname = path.dirname(__filename);
          export default defineConfig({
            plugins: [react()],
            root: 'src/renderer',
            base: './',
            resolve: { alias: { '@': path.resolve(__dirname, 'src/renderer') } },
            build: { outDir: path.resolve(__dirname, 'dist/renderer'), emptyOutDir: true },
          });\`;
          fs.writeFileSync('vite.config.mjs', cfg);
          console.log('vite.config.mjs created');
          "

      - name: Build renderer
        run: npx vite build

      - name: Build main process
        run: npx tsc -p tsconfig.main.json || true

      - name: Package DMG
        run: npx electron-builder --mac dmg --x64
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Upload DMG
        uses: actions/upload-artifact@v4
        with:
          name: AgentBrowser-macOS-Intel
          path: release/*.dmg
          retention-days: 7
